# Custom Classification Model with CustomC3 backbone
# Parameters
nc: 9 # IMPORTANT: Set this to your number of classes
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]

# Backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 6, 2, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, CustomC3, [128]] # 2 <-- Your Custom Block
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, CustomC3, [256]] # 4 <-- Your Custom Block
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, CustomC3, [512]] # 6 <-- Your Custom Block
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, CustomC3, [1024]] # 8 <-- Your Custom Block
  - [-1, 1, SPPF, [1024, 5]] # 9

# Classification Head
head:
  - [-1, 1, Classify, [nc]] # 12, Final Linear Layer
